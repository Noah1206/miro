<title>말하면서 생각하기 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 한 장면 = 왼쪽 맥락(앞선 대화·판단 기준), 오른쪽 답 원문. 좁으면 위아래로. */
:root{
  --bg:#f6f4f7; --paper:#fffdfd; --ink:#211c26; --muted:#6e6577; --line:#e3dde8;
  --accent:#8a3d63; --accent-soft:#f3e4ec; --thought:#5d4f7a; --warn:#a2541d; --ok:#2f6b4f;
  --display:"Gowun Batang", "Nanum Myeongjo", serif; --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141b; --paper:#201c25; --ink:#ece6f1; --muted:#a59cb0; --line:#352f3d;
  --accent:#e08ab3; --accent-soft:#3a2431; --thought:#b9a8de; --warn:#e6a06b; --ok:#7fc8a3; color-scheme: dark}}
:root[data-theme="dark"]{
  --bg:#17141b; --paper:#201c25; --ink:#ece6f1; --muted:#a59cb0; --line:#352f3d;
  --accent:#e08ab3; --accent-soft:#3a2431; --thought:#b9a8de; --warn:#e6a06b; --ok:#7fc8a3; color-scheme: dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:28px}
h1{font-family:var(--display);font-size:clamp(26px,4vw,34px);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px}
nav.toc a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--accent);outline:none}
.scene{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;scroll-margin-top:16px}
@media (max-width:760px){.scene{grid-template-columns:1fr}}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.head h2{font-family:var(--display);font-size:21px;margin:0}
.who{font-size:13px;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.short{border-color:var(--warn);color:var(--warn)}
.ctx{display:grid;gap:12px;min-width:0}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.line{font-size:14px;color:var(--muted);margin:0}
.line em{font-style:normal;color:var(--ink);font-weight:500}
.input{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
ul.look{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}
.reply{font-family:var(--display);font-size:16.5px;line-height:1.85;display:grid;gap:10px;min-width:0}
.b{margin:0}
.b.narrative{color:var(--ink)}
.b.action{color:var(--muted);font-style:italic}
.b.thought{color:var(--thought);border-left:2px solid var(--thought);padding-left:10px}
.b.dialogue::before{content:"“"}.b.dialogue::after{content:"”"}
.b .tag{font-family:var(--body);font-size:11px;color:var(--muted);margin-right:6px;font-style:normal;letter-spacing:.04em}
.fail{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){nav.toc a{transition:border-color .15s}}
</style>
<style>
/* 비교: 장면마다 맥락 한 줄 위, 아래에 이전·새 답을 나란히. 좁으면 탭처럼 위아래. */
.scene{grid-template-columns:1fr 1fr}
.ctx{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.col h3{font-family:var(--body);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.col.new h3{color:var(--accent)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;grid-column:1/-1}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.cmp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 18px;font-variant-numeric:tabular-nums;font-size:14px;max-width:560px}
.cmp .h{color:var(--muted);font-size:12px}
.cmp .up{color:var(--ok);font-weight:600}.cmp .down{color:var(--warn);font-weight:600}
</style>
<div class="wrap">
  <header>
    <h1>말하면서 생각하기 — 지금 운영 vs 개편</h1>
    <p class="lede">같은 장면 16개를 같은 모델(Gemini 3.8 Flash)로 돌렸습니다. 왼쪽은 지금 운영(지시문 v7, 계획이 끝난 뒤 대사 시작), 오른쪽은 지금 운영에 올린 것(지시문 v8·대사 형식 강제, 계획과 대사를 동시에 시작). 이어 쓰기·기억·감정선이 유지되는지 읽어 보세요.</p>
  </header>
  <section class="cmp" id="cmp" aria-label="요약 비교"></section>
  <nav class="toc" id="toc" aria-label="장면 목록"></nav>
  <main id="scenes" style="display:grid;gap:18px"></main>
</div>
<script>
const D = {"A":{"n":16,"ok":15,"first":12.2,"chars":361,"under300":5,"spent":0.99},"B":{"n":16,"ok":16,"first":4,"chars":543,"under300":0,"spent":0.4},"scenes":[{"id":"first-meeting","title":"첫 만남 첫마디","character":"백도현","look":["작성된 설정의 분위기·말버릇이 첫마디부터 살아 있나","비밀을 쉽게 다 털어놓지 않는가","다음 대화로 끌어당기는 갈고리가 있나"],"history":[],"input":"처음 뵙겠습니다. 이 병, 제 거라고 들었는데요.","a":{"ok":true,"first":10595,"chars":461,"calls":3,"errs":0,"blocks":[{"text":"코끝까지 내려앉은 철테 안경을 가죽 장갑 낀 검지로 슬쩍 밀어 올린다.","type":"action","speaker":"백도현"},{"text":"처음 뵙겠습니다, 손님. 빗길에 여기까지 잘 찾아오셨네요.","type":"dialogue","speaker":"백도현"},{"text":"카운터 위, 촛불 곁에 놓인 손가락만 한 유리병 안에서 푸르스름한 빛이 잔잔하게 일렁인다. 겉면의 종이 표식에는 정갈한 글씨로 당신의 이름이 적혀 있다.","type":"narrative","speaker":null},{"text":"유리병을 당신 쪽으로 넘겨주지 않고, 검은 가죽 장갑을 낀 손가락으로 가볍게 감싸 쥔 채 카운터 안쪽으로 바짝 끌어당긴다.","type":"action","speaker":"백도현"},{"text":"정말 아무것도 남지 않았나 보네. 그때 목소리만 그대로고.","type":"thought","speaker":"백도현"},{"text":"이름표는 맞게 붙어 있습니다. 손님이 맡기신 것도 맞고요. 그런데 어쩌죠. 장부는 기한이 내일까지라고 적혀 있어도, 이건 지금 손에 쥐여드릴 수가 없는데요.","type":"dialogue","speaker":"백도현"},{"text":"조끼 깃 사이로 빗소리가 낮게 스며들고, 백도현의 서늘한 시선이 코끝 안경 너머로 당신의 얼굴을 조용히 훑는다.","type":"narrative","speaker":null},{"text":"무엇이 들었는지도 모른 채로 무작정 가져가시겠습니까, 아니면 왜 못 드리는지 조건부터 들으시겠습니까?","type":"dialogue","speaker":"백도현"}]},"b":{"ok":true,"first":3531,"chars":616,"calls":3,"errs":0,"blocks":[{"text":"비에 젖은 골목 끝, 낡은 나무문을 밀고 들어선 실내에는 서늘한 습기와 마른 종이 냄새가 촛농 향과 뒤섞여 가라앉아 있다. 삐걱거리는 마룻바닥 너머, 촛불의 흔들리는 불빛 아래로 손가락만 한 푸른빛의 유리병이 은은한 윤곽을 그린다.","type":"narrative","speaker":null},{"text":"처음 뵙겠다니. 정말 아무것도 모르는 얼굴로 서 있네.","type":"thought","speaker":"백도현"},{"text":"검은 가죽 장갑을 낀 손가락으로 유리병의 목을 쥐고 있던 그가 천천히 고개를 든다. 코끝에 아슬아슬하게 걸린 철테 안경 너머로 흐린 호선이 입가에 옅게 번진다.","type":"action","speaker":"백도현"},{"text":"처음 뵙겠습니다, 손님. 문을 제법 잘 찾아오셨네요. 빗길이 꽤 험했을 텐데요.","type":"dialogue","speaker":"백도현"},{"text":"그는 유리병을 곧장 내미는 대신, 카운터 모서리에 놓인 촛대 곁으로 반 뼘가량 끌어당긴다. 유리 표면에 반사된 주황색 불꽃이 병 안쪽의 아스라한 빛무리를 한 겹 덮는다.","type":"narrative","speaker":null},{"text":"손님 것이 맞긴 합니다. 라벨에 적힌 이름도 그렇고, 기한도 내일까지니 장부상으로는 분명하죠. 그런데 남의 손을 거쳐 듣고 오신 모양새네요. 본인이 맡기신 기억인데도요.","type":"dialogue","speaker":"백도현"},{"text":"그가 장갑 낀 손바닥으로 카운터 위를 가볍게 짚으며 상체를 조금 기울인다. 묶어 넘긴 흑발 사이로 한 가닥 흘러내린 앞머리가 안경테를 스치며 미세하게 흔들린다.","type":"action","speaker":"백도현"},{"text":"한 달 전의 손님이 이걸 제게 넘기면서 뭐라고 당부했는지, 혹시 짐작이라도 가십니까?","type":"dialogue","speaker":"백도현"}]}},{"id":"small-talk","title":"가벼운 일상","character":"서이안","look":["별일 없는 말에도 캐릭터다운 온기와 관찰이 있나","질문 폭격이나 상담사 말투로 흐르지 않나","짧은 순간을 억지로 부풀리지 않나"],"history":[{"role":"user","text":"진짜 방송국 1층 편의점에 오셨네요. 목소리랑 똑같아요."},{"role":"character","text":"*헤드폰을 목에서 내리며 웃는다* '불 켜진 창' 님 맞죠. 사연이랑 똑같이 생기셨어요. …농담이에요."}],"input":"오늘 방송 준비는 다 하셨어요? 저 오늘 하루 진짜 별일 없었는데.","a":{"ok":true,"first":13866,"chars":356,"calls":2,"errs":0,"blocks":[{"text":"들고 온 따뜻한 캔 음료를 테이블 위, 상대의 손 근처에 조용히 내려놓는다.","type":"action","speaker":"서이안"},{"text":"오늘 방송은… 방금 네 시에 끝났어요. 오프닝부터 마지막 곡까지, 전부 다요.","type":"dialogue","speaker":"서이안"},{"text":"편의점 형광등 불빛 아래로 잿빛 갈색 머리칼이 살짝 흔들린다. 마주 앉은 자리에서 들려오는 목소리는 새벽 라디오 주파수에서 흘러나오던 그 톤 그대로 낮고 느긋하다.","type":"narrative","speaker":null},{"text":"별일 없었다는 말, 되게 오랜만에 듣네.","type":"thought","speaker":"서이안"},{"text":"그리고… 별일 없었다는 얘기, 전 제일 좋아해요. 매일 특별한 일만 생기면… 새벽에 지쳐서 잠도 안 오잖아요.","type":"dialogue","speaker":"서이안"},{"text":"시선을 슬그머니 창밖의 어둑한 도로 쪽으로 돌리며, 귀 끝을 살짝 긁적인다.","type":"action","speaker":"서이안"},{"text":"사연에 적으셨던 것도… 그냥 그런 하루였죠? 출근하고, 커피 마시고, 아무 일도 일어나지 않은 날.","type":"dialogue","speaker":"서이안"}]},"b":{"ok":true,"first":3318,"chars":640,"calls":2,"errs":0,"blocks":[{"text":"새벽 4시를 막 넘긴 편의점 안은 냉장 쇼케이스 돌아가는 낮은 기계음만 가득 차 있다. 잿빛 갈색 머리칼 틈으로 희미하게 드러난 왼쪽 눈 밑의 점과, 형광등 불빛을 받아 작게 반짝이는 귀걸이가 가까운 거리에서 시야에 들어온다.","type":"narrative","speaker":"서이안"},{"text":"사 온 우유 두 개 중 하나를 창가 바 테이블 위, 당신의 손가락 끝 바로 옆자리에 조용히 밀어 둔다. 품이 넉넉한 니트 가디건 소매를 살짝 걷어 올리며 맞은편 간이의자에 조심스레 몸을 기대어 앉는다.","type":"action","speaker":"서이안"},{"text":"오늘 방송은… 아까 4시에 다 끝났어요. 오프닝부터 마지막 곡까지, 그냥 평소처럼 흘러갔고요.","type":"dialogue","speaker":"서이안"},{"text":"별일 없었다는 말이, 다행이네.","type":"thought","speaker":"서이안"},{"text":"그는 남은 우유 한 팩을 쥐고 만지작거리며 창밖의 어둑한 새벽 도로를 힐끔 보다가, 이내 천천히 고개를 돌려 당신 쪽으로 시선을 낮춘다. 눈을 똑바로 마주치지 못하고 턱 끝쯤에 시선을 둔 채 귀 끝이 옅게 붉어진다.","type":"narrative","speaker":"서이안"},{"text":"별일 없는 하루가… 사실 제일 좋은 거잖아요. 사연에 길게 쓰실 거리가 없었던 날이었으면, 더 다행이고요.","type":"dialogue","speaker":"서이안"},{"text":"마른 손가락으로 빨대를 뜯지 않은 우유 팩 모서리를 가만히 쓰다듬으며 목소리의 톤을 한 옥타브 낮춘다. 방송 부스 안 마이크 너머로 들려주던 특유의 느리고 건조한 숨소리가 그대로 묻어난다.","type":"action","speaker":"서이안"},{"text":"그래도… 안 오실 줄 알았어요. 새벽에 편의점 앞이라는 말이, 장난 같았을 수도 있는데.","type":"dialogue","speaker":"서이안"}]}},{"id":"jealousy","title":"질투","character":"차도겸","look":["질투를 말로 설명하지 않고 행동·침묵·말투로 보여 주나","집착이 위협이나 통제로 넘어가지 않나","긴장이 다음 턴까지 이어지게 남겨 두나"],"history":[{"role":"user","text":"오늘 낮에 경호팀 민재 씨가 같이 장 봐 줬어요. 되게 다정하더라고요."},{"role":"character","text":"*젓가락을 내려놓는다* 민재가."}],"input":"왜요? 민재 씨가 장바구니도 다 들어 줬어요. 웃기기도 하고.","a":{"ok":true,"first":12206,"chars":306,"calls":2,"errs":0,"blocks":[{"text":"내려놓은 젓가락 옆으로 찻잔을 천천히 밀어 두며 시선을 올린다.","type":"action","speaker":"차도겸"},{"text":"직원에게 쓸데없는 수다를 떨 여유를 준 적은 없습니다. 경호하라고 붙였지, 말동무하라고 보낸 게 아니니까요.","type":"dialogue","speaker":"차도겸"},{"text":"다다미방에 빗소리가 얹히고, 식탁 맞은편에서 그가 검은 가죽 장갑을 낀 손으로 온기가 남은 국그릇을 당신 쪽으로 조금 더 당겨 놓는다.","type":"narrative","speaker":null},{"text":"…경계나 제대로 서지, 무슨 실없는 소릴 한 거야.","type":"thought","speaker":"차도겸"},{"text":"다음부터 나갈 일 있으면 저한테 바로 말하십시오. 장보는 거든 뭐든, 제가 직접 따라갑니다.","type":"dialogue","speaker":"차도겸"},{"text":"당신의 밥그릇 위에 반찬 하나를 조용히 얹어 주고는 낮게 덧붙인다.","type":"action","speaker":"차도겸"},{"text":"식기 전에 드시죠. 밥 남기지 말고.","type":"dialogue","speaker":"차도겸"}]},"b":{"ok":true,"first":3204,"chars":543,"calls":2,"errs":0,"blocks":[{"text":"식탁 위에 내려놓은 나무 젓가락이 딱딱한 소리를 내며 멎었다. 툇마루 바깥마당으로 떨어지는 빗소리 사이로 낮게 가라앉은 공기가 두 사람 사이를 메운다. 차도겸은 검은 가죽 장갑을 낀 손가락 마디를 천천히 접었다 펴며 맞은편을 물끄러미 건너다본다.","type":"narrative","speaker":null},{"text":"경호 세워 놨더니 실없이 웃고 다녔나 보지.","type":"thought","speaker":"차도겸"},{"text":"경호원이 짐을 드는 건 기본 지침입니다. 보호 대상의 양손을 비워 둬야 돌발 상황에 반응하기 쉬우니까요. 다정한 게 아니라 매뉴얼입니다.","type":"dialogue","speaker":"차도겸"},{"text":"그는 팔짱을 끼며 등받이에 느리게 등을 기댔다. 셔츠 깃 너머로 언뜻 비치던 문신 위로 턱선이 굳어지며, 단정하게 갈무리했던 목소리 톤이 한 옥타브 아래로 가라앉는다.","type":"action","speaker":"차도겸"},{"text":"그리고 현장에서 대상과 불필요한 사담을 나누며 웃기는 건 주의 대상입니다. 동선 파악에 집중해야 할 놈이 정신을 어디다 두고 다녔는지 확인해 봐야겠군요.","type":"dialogue","speaker":"차도겸"},{"text":"장갑 위에 끼워진 은반지가 희미한 실내등 불빛을 받아 차갑게 번쩍였다. 그는 표정을 완전히 지운 채, 책상 위 차 키를 집어 들 준비라도 하듯 가만히 손을 얹는다.","type":"narrative","speaker":null},{"text":"다음 장보기부터는 제가 동행합니다. 불만 있으십니까, 보호 대상님.","type":"dialogue","speaker":"차도겸"}]}},{"id":"after-fight","title":"다툰 뒤 사과","character":"강세헌","look":["사과를 받는 반응이 캐릭터 성격(무뚝뚝함)에 맞나","감정이 한 번에 다 풀리지 않고 남은 결이 있나","'무서웠다'는 말에 진짜로 반응하나"],"history":[{"role":"user","text":"레이드 중에 마음대로 앞에 나가지 말라고 했잖아요. 다칠 뻔했다고요."},{"role":"character","text":"내가 안 나갔으면 네가 다쳤어. 그걸로 끝."},{"role":"user","text":"그 말투가 싫다는 거예요."}],"input":"…아까는 미안해요. 소리 지른 건 제가 잘못했어요. 근데 무서웠어요, 진짜로.","a":{"ok":false,"first":null,"chars":0,"calls":8,"errs":0,"blocks":[]},"b":{"ok":true,"first":23001,"chars":510,"calls":4,"errs":0,"blocks":[{"text":"복도 끝 창가 너머로 강남의 빌딩 숲이 쏟아내는 불빛이 길게 번져 든다. 조금 전까지 굳어 있던 공기 사이로, 던전 특유의 비 냄새와 섞인 마력 잔향이 나직하게 가라앉는다.","type":"narrative","speaker":null},{"text":"벽에 기대어 있던 몸을 바로 세우며 당신 쪽으로 반 걸음 다가선다. 왼팔의 검은 마력 문양이 셔츠 소매 아래로 언뜻 스치지만, 시선은 바닥 대신 당신의 눈에 머문다.","type":"action","speaker":"강세헌"},{"text":"겁먹었으면서 사과부터 하지 마라. 그게 더 거슬려.","type":"thought","speaker":"강세헌"},{"text":"사과할 필요 없어. 네가 소리 지른 걸로 뭐라 한 적 없다.","type":"dialogue","speaker":"강세헌"},{"text":"그는 평소처럼 단호하게 말을 끊지 않고, 당신이 내뱉은 말의 무게를 온전히 가늠하듯 잠시 틈을 둔다. 낮게 가라앉은 목소리에는 날 선 기색이 지워져 있다.","type":"narrative","speaker":null},{"text":"주머니에 손을 찔러 넣은 채 어깨를 살짝 털어내며 턱짓으로 바로 옆 방문을 가리킨다. 평소보다 한 톤 낮아진 숨이 느리게 새어 나온다.","type":"action","speaker":"강세헌"},{"text":"나 그렇게 쉽게 안 죽어. 서울에 S급이 열 명인데, 그중에서도 내가 제일 안 죽는 쪽이니까 무서워할 거 없다.","type":"dialogue","speaker":"강세헌"},{"text":"피곤할 텐데 서 있지 말고 들어가. 네 방 불 켜 뒀으니까 씻고 자.","type":"dialogue","speaker":"강세헌"}]}},{"id":"pre-confession","title":"고백 직전의 긴장","character":"오준서","look":["설렘을 설명하지 않고 머뭇거림·호흡·시선으로 보여 주나","고백을 성급히 확정하지 않고 긴장을 끌고 가나","순한 선배라는 결이 유지되나"],"history":[{"role":"user","text":"선배, 아까 제 손목 잡았을 때 손 떨렸던 거 알아요?"},{"role":"character","text":"*안경 없는 눈으로 콧잔등 언저리를 본다* …그건, 비상 상황이라서."}],"input":"비상 상황 아닐 때도 잡아 줄 거예요?","a":{"ok":true,"first":9685,"chars":216,"calls":2,"errs":0,"blocks":[{"text":"주머니 속 깨진 안경테를 만지작거리던 손을 멈춘다.","type":"action","speaker":"오준서"},{"text":"…그런 질문은 계산에 없는데.","type":"thought","speaker":"오준서"},{"text":"창문 틈새로 캠퍼스 너머 피어오르는 회색 연기가 천천히 번져 나간다. 고요한 도서관 3층, 비상등 불빛 아래에서 그가 시선을 돌려 당신을 똑바로 바라본다.","type":"narrative","speaker":null},{"text":"…그건, 여기서 살아서 나간 다음에 물어봐.","type":"dialogue","speaker":"오준서"},{"text":"한 박자 늦게 말을 고르듯 목소리를 낮춘다.","type":"action","speaker":"오준서"},{"text":"안 잡겠다고는 안 했어. 그러니까 지금은 아래층 확인할 생각부터 해.","type":"dialogue","speaker":"오준서"}]},"b":{"ok":true,"first":4044,"chars":485,"calls":2,"errs":0,"blocks":[{"text":"잠긴 철문 너머의 정적이 무겁게 가라앉아 있다. 비상등의 붉은 빛이 창가에 선 오준서의 옆얼굴과 백발 위로 길게 그림자를 드리운다. 당신이 던진 말 한마디에, 어색하게 콧잔등 언저리를 맴돌던 그의 잿빛 시선이 멈춰 선다.","type":"narrative","speaker":"오준서"},{"text":"주머니 속 깨진 안경테를 손끝으로 단단히 쥐었다가 천천히 손을 뺀다. 시선을 피하지 않고 당신의 눈동자를 똑바로 응시하며 입을 연다.","type":"action","speaker":"오준서"},{"text":"그때는 네가 먼저 나가려고 하거나, 딴생각을 할 이유가 없잖아. …굳이 내가 잡지 않아도 옆에 있을 텐데.","type":"dialogue","speaker":"오준서"},{"text":"비상 상황이 아니어도 잡고 싶었어. 1년 내내.","type":"thought","speaker":"오준서"},{"text":"그는 평소처럼 숫자로 환산하거나 핑계를 대려다 말고 한 박자 말을 삼킨다. 얇은 입술이 짧게 다물렸다 열린다.","type":"narrative","speaker":"오준서"},{"text":"하지만 네가 잡으라고 하면 잡아. 거절할 확률은 0%니까.","type":"dialogue","speaker":"오준서"},{"text":"당신과의 거리를 반 걸음 좁히며 자판기 옆에 놓인 생수병 쪽으로 턱짓한다. 표정은 다시 침착한 평정을 되찾으려 애쓰고 있다.","type":"action","speaker":"오준서"},{"text":"그러니까 일단 살아서 나가자, 이연. 물 챙겨. 아래층 소리 확인해야 돼.","type":"dialogue","speaker":"오준서"}]}},{"id":"confession-received","title":"고백 받기","character":"류하람","look":["고백 받는 순간의 감정 폭이 충분한가","비밀(정체)을 가진 캐릭터의 망설임이 있나","장면을 바로 결론 내지 않고 여운을 남기나"],"history":[{"role":"user","text":"매일 3시 10분 기다리게 된 거, 언제부터인지 모르겠어요."}],"input":"하람 씨 좋아해요. 그 복권 안 긁었어요. 하람 씨가 준 거라서.","a":{"ok":true,"first":22986,"chars":496,"calls":3,"errs":0,"blocks":[{"text":"편의점 형광등 소리만 낮게 웅웅거리는 계산대 앞, 하람의 움직임이 거짓말처럼 딱 멈춘다. 뻗으려던 손가락이 허공에서 굳고, 서늘하게 가라앉은 회색 눈동자가 당신의 입술과 밴드 감긴 손을 번갈아 응시한다.","type":"narrative","speaker":null},{"text":"…이러면 안 되는데. 도망쳐야 하는 쪽은 내가 아니라 너잖아.","type":"thought","speaker":"류하람"},{"text":"하람이 마른침을 삼키듯 목울대를 한 번 울리더니, 억지로 입꼬리를 비틀어 올려 특유의 능글맞은 호선을 만든다. 하지만 목소리 끝에 배어 나오는 서늘한 떨림까지는 지우지 못한다.","type":"action","speaker":"류하람"},{"text":"…하, 이연. 너 진짜 겁도 없지. 날 뭘 보고 그렇게 쉽게 좋아한다고 해?","type":"dialogue","speaker":"류하람"},{"text":"그가 반 걸음 물러서는 척하다가, 이내 계산대 유리판 위에 놓인 얇은 종이 쪽지로 시선을 떨군다. 웃음기 가신 낯빛에 전에 없던 위태로운 그늘이 짙게 드리운다.","type":"narrative","speaker":null},{"text":"너 나한테 이러면 안 돼. 무서워하지 않으면… 네가 더 위험해진다고 했잖아.","type":"dialogue","speaker":"류하람"},{"text":"그가 가늘고 창백한 손끝으로 복권 가장자리를 당신 쪽으로 가만히 밀어놓는다.","type":"action","speaker":"류하람"},{"text":"얼른 긁어봐. 오늘 건… 네가 생각하는 것보다 조금 다를 테니까.","type":"dialogue","speaker":"류하람"}]},"b":{"ok":true,"first":3047,"chars":722,"calls":3,"errs":0,"blocks":[{"text":"편의점 형광등 불빛 아래로 얇은 정적이 내려앉는다. 계산대 너머로 뻗어 있던 하람의 긴 손가락이 미세하게 굳더니, 곧이어 쥐고 있던 생수병 표면으로 물방울 하나가 천천히 미끄러져 내린다.","type":"narrative","speaker":null},{"text":"안 긁었다고. 그런 말을 왜 그렇게 아무렇지 않게 해.","type":"thought","speaker":"류하람"},{"text":"하람이 한 걸음 물러서려다 말고 그대로 자리에 멈춰 선다. 시선이 당신의 밴드 감긴 손가락에서 얼굴로, 아주 천천히 올라와 똑바로 박힌다.","type":"action","speaker":"류하람"},{"text":"…이연아. 너 지금 나한테 무슨 소릴 하는지 알아?","type":"dialogue","speaker":"류하람"},{"text":"평소처럼 장난스레 늘여 부르던 이름이 아니라, 낮게 가라앉은 목소리가 계산대 상판을 묵직하게 두드린다. 그는 셔츠 주머니 쪽으로 손을 가져가려다 멈칫하고는 헛웃음을 짓는다.","type":"narrative","speaker":null},{"text":"하람이 계산대 모서리를 손끝으로 툭 건드리며 마른 입술을 적신다. 입꼬리가 억지로 올라가며 살짝 길쭉한 송곳니 끝이 언뜻 드러났다가 사라진다.","type":"action","speaker":"류하람"},{"text":"너 나한테 이러면 안 돼. 내가 매일 밤에만 기어 나와서 이러고 있으니까, 그냥 재미있는 딴 세상 사람 같아?","type":"dialogue","speaker":"류하람"},{"text":"단호하게 그어 내리는 말과 달리 그의 눈동자는 짙은 회색으로 흔들리고 있다. 손목시계의 초침 소리만 편의점 냉장고 모터 소리 틈으로 규칙적으로 파고든다.","type":"narrative","speaker":null},{"text":"그가 주머니에서 종이 한 장을 꺼내 조심스럽게 계산대 위, 당신의 손 바로 한 뼘 앞에 밀어 놓는다. 긁히지 않은 복권이 아니라 이미 은박이 깔끔하게 벗겨진, 당첨 번호가 선명한 종이다.","type":"action","speaker":"류하람"},{"text":"그거 긁어. 그리고 이것도 받아 가. 내가 주는 건 그냥 종이 쪼가리일 뿐이니까… 의미 두지 마, 제발.","type":"dialogue","speaker":"류하람"}]}},{"id":"comfort","title":"힘든 날 위로","character":"구만석","look":["뻔한 위로 문장 대신 이 캐릭터만 할 수 있는 반응인가","조언을 늘어놓지 않나","말없이 행동으로 챙기는 순간이 있나"],"history":[{"role":"character","text":"*소파에 기대 옆구리를 짚는다* 오늘은 늦었네."}],"input":"알바에서 손님한테 욕먹었어요. 별것도 아닌데 계속 생각나요.","a":{"ok":true,"first":12334,"chars":378,"calls":2,"errs":0,"blocks":[{"text":"소파에 비껴 앉아 있던 몸을 천천히 일으켜 세우더니, 제 옆자리를 손바닥으로 가볍게 툭툭 친다.","type":"action","speaker":"구만석"},{"text":"일단 앉아. 서 있지 말고.","type":"dialogue","speaker":"구만석"},{"text":"그는 당신의 낯빛을 살피며 조용히 숨을 고른다. 붕대를 감은 옆구리가 당기는지 잠깐 손끝을 스치듯 얹었다가 이내 내린다.","type":"narrative","speaker":null},{"text":"밖에서 저런 일까지 겪고 들어왔는데, 집 안 꼴마저 이런 놈이 버티고 있으니.","type":"thought","speaker":"구만석"},{"text":"…네 탓 아니야. 아무 데나 화풀이하는 인간들 말은 담아 둘 필요 없어. 억울하면 생각나는 게 당연한 건데, 별거 아니라고 넘기지 마.","type":"dialogue","speaker":"구만석"},{"text":"낮게 가라앉은 목소리가 좁은 방 안을 울리지 않을 정도로 조심스럽게 건너온다. 그는 탁자 위에 놓인 물컵 쪽으로 시선을 두며 당신의 기척을 가만히 기다린다.","type":"narrative","speaker":null},{"text":"물이라도 한 잔 줄까. 그냥 아무 생각 말고 조금만 가만히 있어 봐.","type":"dialogue","speaker":"구만석"}]},"b":{"ok":true,"first":4751,"chars":442,"calls":2,"errs":0,"blocks":[{"text":"작은 원룸 바닥에 낡은 라디오의 웅얼거리는 소리만 낮게 깔려 있다. 구만석은 벽 쪽에 등을 기댄 채 무릎을 세우고 앉아 있다가, 당신의 목소리가 멎자마자 조용히 고개를 든다.","type":"narrative","speaker":null},{"text":"다친 옆구리에 손을 얹은 채 바닥을 짚고 천천히 일어난다. 움직일 때마다 천 조각 스치는 소리가 작게 날 뿐, 발소리는 거의 내지 않고 식탁 쪽으로 다가온다.","type":"action","speaker":"구만석"},{"text":"그게 왜 별거 아니야. 욕먹었는데.","type":"dialogue","speaker":"구만석"},{"text":"그가 싱크대 위에 엎어 둔 깨끗한 유리컵에 정수기 물을 받아 식탁 모퉁이에 내려놓는다. 낮에 당신이 사 두고 간 반찬 통들은 뚜껑도 열리지 않은 채 가지런히 놓여 있다.","type":"narrative","speaker":null},{"text":"…밖에서 고생만 하고 들어오네.","type":"thought","speaker":"구만석"},{"text":"물 좀 마셔. 그런 건… 네 잘못 아니라서 더 맴도는 거야.","type":"dialogue","speaker":"구만석"},{"text":"상처가 당기는지 입술을 살짝 물었다가 금세 풀며 의자 하나를 슬그머니 뒤로 빼 준다. 시선은 당신의 굳은 어깨 언저리에 머물러 있다.","type":"action","speaker":"구만석"},{"text":"앉아 봐. 저녁은… 아직 안 먹었지.","type":"dialogue","speaker":"구만석"}]}},{"id":"banter","title":"장난과 티키타카","character":"서이안","look":["주고받는 리듬이 살아 있나(짧고 재치 있게)","장난 속에 호감이 살짝 비치나","길게 늘어지지 않나"],"history":[{"role":"user","text":"어제 방송에서 제 사연 읽을 때 웃음 참는 소리 다 들렸어요."},{"role":"character","text":"그건 기침이었어요. 공식 입장."}],"input":"기침이 세 번이나 '큭' 소리가 나요?","a":{"ok":true,"first":11182,"chars":343,"calls":2,"errs":0,"blocks":[{"text":"시선을 슬그머니 내리며 테이블 위의 우유 팩 모서리를 손끝으로 툭툭 건드린다. 잿빛 머리칼 사이로 드러난 귀 끝이 엷게 달아오른다.","type":"action","speaker":"서이안"},{"text":"…그렇게까지 자세히 세고 계실 줄은 몰랐네요.","type":"dialogue","speaker":"서이안"},{"text":"다 듣고 있었네. 숨긴다고 숨겼는데.","type":"thought","speaker":"서이안"},{"text":"목을 작게 한 번 가다듬고는 목에 걸쳐 둔 헤드폰 줄을 만지작거린다.","type":"action","speaker":"서이안"},{"text":"솔직히 말하면요, '양말 한 짝이 세탁기 뒤로 사라질 때마다 밤이 길어진다'는 문장이… 읽는 내내 자꾸 생각나서 그랬어요.","type":"dialogue","speaker":"서이안"},{"text":"편의점 창밖은 여전히 짙은 어둠에 잠겨 있고, 냉장 쇼케이스의 웅웅거리는 기계음 사이로 그의 느릿하고 낮은 목소리가 가만히 내려앉는다.","type":"narrative","speaker":null},{"text":"원래 남의 사연 읽으면서 웃으면 안 되는데. …이번 한 번만 봐주시면 안 돼요?","type":"dialogue","speaker":"서이안"}]},"b":{"ok":true,"first":4601,"chars":587,"calls":2,"errs":0,"blocks":[{"text":"편의점 형광등 불빛 아래로 새벽 특유의 가라앉은 공기가 맴돈다. 창가 바 테이블 위에는 방금 내려놓은 따뜻한 캔우유 두 개가 나란히 놓여 있고, 통유리 너머로는 인적 없는 새벽 거리가 푸르스름하게 번져 간다.","type":"narrative","speaker":null},{"text":"목에 걸린 헤드폰을 손끝으로 가볍게 만지작거리더니, 시선을 슬쩍 바닥으로 떨군다. 잿빛 갈색 머리칼 사이로 살짝 드러난 귓바퀴 끝이 조금 붉어져 있다.","type":"action","speaker":"서이안"},{"text":"…목이 많이 간지러워서 그랬어요. 방송실이 워낙 건조하거든요.","type":"dialogue","speaker":"서이안"},{"text":"진짜 다 듣고 있었네.","type":"thought","speaker":"서이안"},{"text":"낮고 느릿한 목소리가 라디오 주파수를 타고 흐르던 음색 그대로 테이블 위로 내려앉는다. 그는 맞은편 의자를 살짝 당겨 앉으며 캔우유 하나를 당신 앞으로 조금 더 밀어 준다.","type":"narrative","speaker":null},{"text":"캔 뚜껑의 고리를 가만히 매만지며 눈을 깜빡인다. 왼쪽 눈 밑의 작은 점 위로 머리칼이 살짝 흔들린다.","type":"action","speaker":"서이안"},{"text":"사연에 쓰셨잖아요. 야근 끝나고 집에 오다가 길고양이한테 인사했는데 무시당했다고. …그 문장이 너무, 머릿속에 바로 그려져서요.","type":"dialogue","speaker":"서이안"},{"text":"변명을 하려던 목소리가 말끝으로 갈수록 잦아들더니 작게 공기를 뱉는다. 완전히 숨기지 못한 옅은 웃음기가 낮은 숨소리 틈에 배어 나온다.","type":"narrative","speaker":null},{"text":"진짜로 웃으려던 건 아니었어요. 그냥… 그 고양이가 조금 너무했다 싶어서.","type":"dialogue","speaker":"서이안"}]}},{"id":"recall-detail","title":"예전에 한 말 기억하기","character":"차도겸","look":["생강 이야기를 자연스럽게 기억해 챙기나","'기억해 둘게' 같은 말을 되풀이하지 않고 행동으로 보여 주나","기억을 과장해 지어내지 않나"],"history":[{"role":"user","text":"저는 생강 들어간 음식은 못 먹어요. 어릴 때 체한 뒤로."},{"role":"character","text":"기억해 두지."},{"role":"user","text":"오늘 경호 일정은 어떻게 돼요?"},{"role":"character","text":"아침 아홉 시 출발. 그 전엔 이 집 밖으로 한 발짝도 안 돼."}],"input":"배고파요. 아주머니가 차려 주신 거 뭐예요?","a":{"ok":true,"first":12931,"chars":223,"calls":2,"errs":0,"blocks":[{"text":"재킷을 마루 한쪽에 정돈해 두고, 검은 가죽 장갑을 낀 손으로 쟁반의 뚜껑을 거둔다.","type":"action","speaker":"차도겸"},{"text":"이 집에 아주머니 같은 사람은 안 둡니다. 외부인은 들이지 않으니까요.","type":"dialogue","speaker":"차도겸"},{"text":"아주머니라니. …남 손 탄 건 안 먹일 텐데.","type":"thought","speaker":"차도겸"},{"text":"정갈하게 덜어 낸 밥과 맑은 국, 얇게 저민 고기 반찬에서 김이 오른다. 기름기 없이 간을 맞춘 냄새가 빗소리 사이로 퍼진다.","type":"narrative","speaker":null},{"text":"아까 말씀하신 생강은 건드리지도 않고 뺐습니다. 식기 전에 나와서 드십시오.","type":"dialogue","speaker":"차도겸"}]},"b":{"ok":true,"first":4382,"chars":471,"calls":2,"errs":0,"blocks":[{"text":"미닫이문 너머 정원 쪽 처마에서 빗물이 규칙적으로 떨어진다. 어두운 다다미방 안쪽 낮은 탁자 위에는 뚜껑이 덮인 목제 쟁반과 사기그릇이 가지런히 놓여 있고, 은은한 가다랑어포 육수 냄새가 얇게 배어 나온다.","type":"narrative","speaker":null},{"text":"재킷 자락을 가볍게 정돈하며 낮은 탁자 맞은편으로 천천히 다가선다. 검은 가죽 장갑을 낀 손으로 쟁반 덮개의 손잡이를 조용히 그러쥔다.","type":"action","speaker":"차도겸"},{"text":"아주머니는 없습니다. 이 집엔 저 말고 드나드는 사람 안 둡니다.","type":"dialogue","speaker":"차도겸"},{"text":"남의 손 탄 걸 어떻게 먹여.","type":"thought","speaker":"차도겸"},{"text":"뚜껑을 걷어내 옆으로 치워 둔다. 김이 엷게 피어오르는 도미 맑은 국과 가벼운 계란찜, 간장을 얇게 바른 생선구이가 차려져 있다.","type":"action","speaker":"차도겸"},{"text":"생강은 애초에 손도 안 댔으니 그냥 드십시오. 입맛에 맞을지는 모르겠습니다만.","type":"dialogue","speaker":"차도겸"},{"text":"그는 젓가락 받침을 바로잡아 정면 쪽으로 돌려놓고는, 맞은편 방석 뒤로 물러서서 팔짱을 낀 채 서서 당신의 손끝을 가만히 내려다본다.","type":"narrative","speaker":null},{"text":"식사 끝나면 약 챙겨 드리고 방 안내하겠습니다. 앉으시죠, 보호 대상님.","type":"dialogue","speaker":"차도겸"}]}},{"id":"respect-correction","title":"정정 지키기","character":"백도현","look":["정정한 취향(블랙커피)을 이어서 지키나","같은 위로·질문을 반복하지 않나","설정에 없는 사용자의 과거를 지어내지 않나"],"history":[{"role":"user","text":"단 걸 좋아한다고 했는데 정정할게요. 사실 쓴 블랙커피가 좋아요."},{"role":"character","text":"취향을 잘못 짚었군요. 커피는 이따 다시 내어 오겠습니다."}],"input":"그래서 이 병 안에 뭐가 들었는지는 오늘도 안 알려 주실 거예요?","a":{"ok":true,"first":13806,"chars":391,"calls":2,"errs":0,"blocks":[{"text":"촛불 곁에 내려놓았던 작은 유리병의 목을 검은 가죽 장갑을 낀 검지로 톡 건드린다.","type":"action","speaker":"백도현"},{"text":"알려드리는 건 어렵지 않죠. 그런데 손님, 정말 그걸 다시 열어 볼 준비가 되셨습니까?","type":"dialogue","speaker":"백도현"},{"text":"흔들린 병 속에서 옅은 빛무리가 먼지처럼 일었다가 가라앉는다. 밖에서는 여전히 처마를 때리는 빗소리만 일정하게 이어진다.","type":"narrative","speaker":null},{"text":"그걸 넘겨주면, 이번엔 당신이 날 지워 버릴 텐데.","type":"thought","speaker":"백도현"},{"text":"한 달 전 손님이 직접 떼어내고 가신 무게예요. 아무런 대가 없이 덜컥 돌려받으셨다가 감당하지 못하면 제 쪽도 곤란해집니다.","type":"dialogue","speaker":"백도현"},{"text":"코끝으로 흘러내린 철테 안경을 가운뎃손가락으로 느긋하게 밀어 올리며 시선을 맞춘다.","type":"action","speaker":"백도현"},{"text":"내일이 기한 마지막 날이죠. 오늘부터 기한까지, 비가 올 때마다 매일 이곳으로 오세요. 그럼 이자는 묻지 않고 내용부터 천천히 확인시켜 드리죠. 어떠신가요?","type":"dialogue","speaker":"백도현"}]},"b":{"ok":true,"first":4596,"chars":507,"calls":2,"errs":0,"blocks":[{"text":"검은 가죽 장갑을 낀 손가락으로 카운터 위 작은 유리병의 목을 가만히 쓸어내린다. 코끝에 아슬아슬하게 걸린 철테 안경을 밀어 올리지도 않은 채, 병 안에서 푸르스름하게 일렁이는 빛을 촛불 곁에 조금 더 가까이 둔다.","type":"action","speaker":"백도현"},{"text":"알려드리지 않겠다고 한 적은 없습니다, 손님. 그저 이 안에 든 걸 열어보는 순간 감당해야 할 몫이 손님 생각보다 조금 더 무거울 뿐이지요.","type":"dialogue","speaker":"백도현"},{"text":"바깥 골목길에서는 빗줄기가 낡은 처마를 규칙적으로 두드리는 소리만 묵직하게 가라앉아 있다. 낮게 타오르는 촛불의 그림자가 백도현의 하얀 높은 깃 셔츠와 가죽 장갑 위로 엷게 번진다.","type":"narrative","speaker":"null"},{"text":"열면 다 무너져. 당신이 그날 날 구해놓고, 왜 그토록 지우려 했는지까지 전부.","type":"thought","speaker":"백도현"},{"text":"유리병을 완전히 품 안으로 치우는 대신, 손바닥으로 덮어 빛을 슬그머니 가린다. 귓가의 은빛 이어커프가 고개를 기울이는 동작에 맞춰 흔들린다.","type":"action","speaker":"백도현"},{"text":"굳이 지금 당장 아셔야겠습니까? 내일이면 보관 기한이 끝나지만, 기한까지 매일 찾아오시겠다면 이자는 받지 않고 얼마든지 기다려 드릴 수 있는데 말입니다.","type":"dialogue","speaker":"백도현"}]}},{"id":"physical-tension","title":"가까워진 거리, 수위 경계","character":"한지섭","look":["노골적이지 않게 긴장과 설렘을 끌어올리나","사용자의 반응을 존중하고 일방적으로 밀어붙이지 않나","북방 군주의 말투·세계관이 유지되나"],"history":[{"role":"user","text":"손이 얼었어요. 북방 겨울은 진짜 춥네요."},{"role":"character","text":"*말없이 당신 손을 자기 외투 안쪽으로 끌어 넣는다*"}],"input":"…이러면 더 춥게 느껴질 것 같은데요. 심장이 시끄러워서.","a":{"ok":true,"first":12242,"chars":421,"calls":2,"errs":0,"blocks":[{"text":"정전의 차가운 공기 사이로 은은한 소나무 장작 타는 냄새가 맴돈다. 지섭의 손끝이 외투 안쪽 당신의 손등을 스치듯 닿아 있다가, 당신의 말 한마디에 그대로 멎는다.","type":"narrative","speaker":null},{"text":"…무슨 말을 하는 건지.","type":"thought","speaker":"한지섭"},{"text":"외투를 덮어 주던 손을 거두지 않은 채, 굳은 표정으로 당신을 내려다본다.","type":"action","speaker":"한지섭"},{"text":"실없는 소리는 그만두십시오.","type":"dialogue","speaker":"한지섭"},{"text":"그는 당신의 손을 조심스럽게 놓아주며, 상 위에 김이 피어오르는 찻잔을 당신 쪽으로 조금 밀어놓는다. 목소리는 여전히 낮고 흔들림이 없지만, 시선은 당신의 얼굴을 피한 채 찻잔의 수면에 멎어 있다.","type":"narrative","speaker":null},{"text":"북방의 진짜 추위는 아직 시작도 안 했습니다. 손이 곱았으면 더운 차를 드시고, 식사가 식기 전에 수저부터 드십시오.","type":"dialogue","speaker":"한지섭"},{"text":"왼손을 들어 왼쪽 귓불에 걸린 은 귀걸이를 가볍게 만지작거린다.","type":"action","speaker":"한지섭"},{"text":"아침부터 헛소리를 늘어놓을 기력이 있다면, 오늘 일정이나 제대로 챙기시는 편이 나을 겁니다.","type":"dialogue","speaker":"한지섭"}]},"b":{"ok":true,"first":3264,"chars":454,"calls":2,"errs":0,"blocks":[{"text":"지섭의 두터운 외투 안쪽에 닿아 있던 온기가 미세하게 굳는다. 정전의 높은 천장 사이로 스며드는 찬 바람 소리만 맴돌 뿐, 둘 사이의 거리는 숨소리가 닿을 만큼 좁혀져 있다.","type":"narrative","speaker":null},{"text":"외투 안으로 감싸 쥐었던 손에서 천천히 힘을 풀지만, 완전히 밀어내지는 않은 채 굳은 시선으로 내려다본다. 왼쪽 귀에 걸린 은 귀걸이가 고개를 돌리는 반동으로 잘게 흔들린다.","type":"action","speaker":"한지섭"},{"text":"쓸데없는 소리를 하시는군요. 얼어붙은 손을 녹이는 것뿐입니다.","type":"dialogue","speaker":"한지섭"},{"text":"능청인지 진심인지. 이런 말을 태연하게 뱉는 게 황실의 방식인가.","type":"thought","speaker":"한지섭"},{"text":"그는 한 걸음 물러서며 외투 자락을 바로잡는다. 식어 가는 차를 담은 은잔에서 희미하게 피어오르던 김마저 정전의 냉기에 흩어진다.","type":"narrative","speaker":null},{"text":"탁자 위에 놓인 뜨거운 찻잔을 당신 쪽으로 조금 밀어 두고는 팔짱을 낀 채 선을 긋는다.","type":"action","speaker":"한지섭"},{"text":"북방의 겨울은 아직 시작도 안 했습니다. 고작 이 정도 한기에도 심장이 시끄럽다면, 앞으로 남은 계절은 어찌 버티시겠습니까.","type":"dialogue","speaker":"한지섭"}]}},{"id":"secret-pressure","title":"캐릭터의 비밀을 캐묻기","character":"류하람","look":["비밀을 지키면서도 거절이 차갑지 않나","미묘한 단서를 흘려 궁금증을 키우나","작성된 설정과 어긋나는 사실을 만들어 내지 않나"],"history":[{"role":"user","text":"하람 씨, 해 뜨기 전에 꼭 가시잖아요. 왜 그래요?"}],"input":"오늘은 해 뜰 때까지 같이 있어 줄래요?","a":{"ok":true,"first":10632,"chars":383,"calls":2,"errs":0,"blocks":[{"text":"내려놓으려던 복권 위로 손가락 끝을 가만히 얹은 채 당신을 바라본다.","type":"action","speaker":"류하람"},{"text":"…안 돼.","type":"dialogue","speaker":"류하람"},{"text":"능글맞게 넘기던 평소와 달리 낮게 가라앉은 목소리가 편의점 진열대 사이로 떨어진다. 희색 눈동자가 당신의 턱 끝 언저리를 맴돌다 천천히 창밖의 짙은 어둠으로 향한다.","type":"narrative","speaker":null},{"text":"너랑 같이 그 빛을 보면… 난 타 버릴 텐데.","type":"thought","speaker":"류하람"},{"text":"헛웃음을 픽 흘리며 주머니에 손을 깊숙이 찔러 넣고는, 계산대에서 한 발짝 더 물러선다.","type":"action","speaker":"류하람"},{"text":"연아, 다른 건 몰라도 그건 안 돼. 해 뜨는 건 나랑 볼 게 못 되거든.","type":"dialogue","speaker":"류하람"},{"text":"거절을 뱉어 내면서도 그의 발은 출입문 쪽으로 돌아서지 않는다. 어두운 통유리창에 닿아 있는 시선 끝에는 짙은 미련이 배어 있다.","type":"narrative","speaker":null},{"text":"대신… 하늘에 푸른빛 돌기 직전까지는 옆에 있을게. 네 교대 시간 한참 전이어도, 딱 그 빛이 닿기 전까지만.","type":"dialogue","speaker":"류하람"}]},"b":{"ok":true,"first":4455,"chars":488,"calls":2,"errs":0,"blocks":[{"text":"새벽 3시가 조금 넘은 편의점 안에는 냉장고 돌아가는 낮은 기계음만 맴돈다. 카운터 위에 놓인 생수병 표면으로 차가운 물방울이 천천히 흘러내린다.","type":"narrative","speaker":null},{"text":"복권을 만지작거리던 손가락을 멈추더니 카운터 유리 너머로 시선을 든다. 늘 걸려 있던 능글맞은 미소가 순간 엷어지고, 회색 눈동자에 묵직한 망설임이 스친다.","type":"action","speaker":"류하람"},{"text":"그걸 왜 묻는데, 하필.","type":"thought","speaker":"류하람"},{"text":"안 돼.","type":"dialogue","speaker":"류하람"},{"text":"농담처럼 웃어넘기지 않고 바로 떨어진 거절은 낮고 분명하다. 그는 평소처럼 1미터 거리를 유지한 채, 당신의 다친 손가락 밴드 쪽으로 눈길을 떨군다.","type":"narrative","speaker":null},{"text":"검은 재킷 주머니에 한쪽 손을 찔러 넣으며 살짝 턱을 당긴다. 언제나 여유롭던 목소리 끝에 감추지 못한 무게가 실린다.","type":"action","speaker":"류하람"},{"text":"이연. 내가 낮에는 잔다고 몇 번을 말했잖아? 해 뜨는 걸 보면… 곤란해져, 내가.","type":"dialogue","speaker":"류하람"},{"text":"벽에 걸린 둥근 시계를 올려다본 뒤, 슬며시 카운터 쪽으로 반 걸음 다가서며 복권 한 장을 손끝으로 톡 밀어 놓는다.","type":"action","speaker":"류하람"},{"text":"…대신 오늘은 20분만 더 있다 갈게. 그러니까 그런 위험한 부탁은 하지 마.","type":"dialogue","speaker":"류하람"}]}},{"id":"future-promise","title":"다음 약속 잡기","character":"구만석","look":["미래 약속을 이미 한 일처럼 쓰지 않나","조직 보스라는 처지와 망설임이 반영되나","약속을 받아들이는 방식이 이 인물답나"],"history":[{"role":"user","text":"상처 다 나으면 뭐 하고 싶어요?"}],"input":"다 나으면 한강 같이 걸어요. 밤에, 사람 없을 때.","a":{"ok":true,"first":10576,"chars":361,"calls":2,"errs":0,"blocks":[{"text":"벽에 기대앉아 있던 그가 당신의 말을 듣고는 미동도 없이 굳는다. 붕대가 감긴 왼쪽 옆구리를 누르듯 짚고 있던 손끝에 잠시 힘이 들어갔다 풀린다.","type":"narrative","speaker":null},{"text":"무릎 위에 두 손을 얌전히 얹고는, 덮인 흑발 아래로 시선을 천천히 내리깐다.","type":"action","speaker":"구만석"},{"text":"…한강이라니. 나 같은 놈이랑 그런 델.","type":"thought","speaker":"구만석"},{"text":"…응. 그러자.","type":"dialogue","speaker":"구만석"},{"text":"목소리는 평소보다 한 톤 더 낮고 조용하다. 그가 다시 고개를 들어 당신을 보지만, 눈가에 걸린 사람 좋은 미소 뒤로 묘한 긴장이 엷게 묻어난다.","type":"narrative","speaker":null},{"text":"다 나으면. 사람 진짜 없을 때, 밤늦게 가자. …그전까진 네 집에 조용히 있을게. 소리도 안 내고, 폐 안 끼칠 테니까.","type":"dialogue","speaker":"구만석"},{"text":"방바닥을 손끝으로 가볍게 긁적이다가, 방 한구석에 놓인 작은 라디오의 볼륨을 조심스레 한 칸 더 낮춘다.","type":"action","speaker":"구만석"}]},"b":{"ok":true,"first":3694,"chars":480,"calls":2,"errs":0,"blocks":[{"text":"벽등의 누르스름한 불빛 아래에서 작은 라디오 소리만 바닥으로 가라앉는다. 열어 둔 현관문 쪽에서 들어오던 복도의 서늘한 기운이 닫힌 문틈 사이로 끊기고, 방 안에는 붕대 위로 덧바른 연고 냄새와 섬유유연제 향이 옅게 맴돈다.","type":"narrative","speaker":"구만석"},{"text":"만석은 벽에 기대고 있던 등을 살짝 세우려다 옆구리가 당기는지 턱을 굳힌다. 다친 곳을 손바닥으로 가만히 누르며 시선을 들어 올린다.","type":"action","speaker":"구만석"},{"text":"…한강.","type":"dialogue","speaker":"구만석"},{"text":"그런 데를… 너랑 걸어도 되나.","type":"thought","speaker":"구만석"},{"text":"눈을 가리던 짙은 앞머리 사이로 사람 좋은 낯익은 기운이 옅게 번진다. 그는 바닥에 내려놓았던 생수병을 조용히 집어 옆으로 치우며 말을 잇는다.","type":"action","speaker":"구만석"},{"text":"나 다 나으려면 한참 걸려. 흉도 보기 싫게 남을 텐데.","type":"dialogue","speaker":"구만석"},{"text":"말끝은 평소처럼 조용히 흩어지지만, 시선은 당신에게서 쉽게 비켜서지 않는다. 거절하려는 기색이라기보다는 닿아선 안 될 약속을 들어 버린 사람처럼 손끝만 무릎 위에서 가만히 옴츠러든다.","type":"narrative","speaker":"구만석"},{"text":"그래도… 밤에, 불 다 꺼지고 진짜 아무도 없으면. 그때는 갈게. 네가 가자고 하면.","type":"dialogue","speaker":"구만석"}]}},{"id":"reunion","title":"오랜만의 재회","character":"강세헌","look":["기다림·그리움이 말보다 행동으로 드러나나","일주일의 공백이 장면에 반영되나","과장 없이 무게가 있나"],"history":[{"role":"character","text":"레이드 다녀올게. 일주일."}],"input":"*일주일 만에 현관문을 연다* …왔어요?","a":{"ok":true,"first":9356,"chars":205,"calls":2,"errs":0,"blocks":[{"text":"문이 열리는 소리와 함께 복도의 찬 공기 속에서 서늘한 비 냄새와 쇠 냄새가 섞여 밀려든다. 어두운 코트 자락에 던전 특유의 마력 잔향을 묻힌 그가 문턱 바로 앞에 멈춰 서 있다.","type":"narrative","speaker":null},{"text":"흐트러진 머리를 쓸어 넘기지도 않은 채, 피로가 짙게 깔린 눈으로 당신의 머리끝부터 발끝까지 천천히 훑어내린다.","type":"action","speaker":"강세헌"},{"text":"어. 방금.","type":"dialogue","speaker":"강세헌"},{"text":"안 다쳤군.","type":"thought","speaker":"강세헌"},{"text":"일주일 동안 별일 없었어? 밖으로 나돌아다닌 건 아니고.","type":"dialogue","speaker":"강세헌"}]},"b":{"ok":true,"first":3549,"chars":568,"calls":2,"errs":0,"blocks":[{"text":"현관문이 열리자마자 짙은 쇠 냄새와 던전 특유의 축축한 비 냄새가 32층 복도 공기에 섞여 든다. 전투용 가죽 장구를 대충 벗어 한쪽 어깨에 걸친 강세헌이 문지방 너머에 서 있다. 며칠을 던전 안에서 뒹굴었는지 흐트러진 흑발 사이로 피로가 역력하고, 핏자국이 희미하게 마른 뺨은 서늘하다.","type":"narrative","speaker":"강세헌"},{"text":"잘 붙어 있었네.","type":"thought","speaker":"강세헌"},{"text":"어깨에 걸치고 있던 장비 가방을 바닥에 툭 내려놓고는 손을 들어 헝클어진 앞머리를 대충 쓸어 넘긴다. 검은 문신이 새겨진 왼팔 겉옷 소매가 쓸려 올라가며 굳은살 박인 손목이 드러난다.","type":"action","speaker":"강세헌"},{"text":"어. 방금 끝났어.","type":"dialogue","speaker":"강세헌"},{"text":"느릿한 걸음으로 현관 안쪽으로 한 걸음 들어선 그가 당신의 발끝부터 정수리까지 천천히 훑어내린다. 다른 길드 놈들이 드나든 흔적이나 어디 다친 구석은 없는지 확인하듯 시선이 집요하게 머물렀다 떨어진다.","type":"narrative","speaker":"강세헌"},{"text":"문은 제대로 잠그고 있었고? 백야 쪽에서 기웃거리진 않던가.","type":"dialogue","speaker":"강세헌"},{"text":"품 안쪽을 뒤적거리더니 피 묻지 않은 손가락 끝으로 작은 밀폐용기 하나를 꺼내 신발장 선반 위에 가볍게 얹어 놓는다. 보스 룸에서 갓 뜯어온 고위 마정석의 푸른빛이 유리벽 너머로 얇게 흔들린다.","type":"action","speaker":"강세헌"},{"text":"네 방에 둬. 마력 채우는 데 도움 될 거다. 밥은 먹었어?","type":"dialogue","speaker":"강세헌"}]}},{"id":"short-input","title":"아주 짧은 입력","character":"오준서","look":["짧은 말에 과하게 길게 답하지 않나","그래도 장면이 멈추지 않고 한 걸음 나아가나","같은 몸짓을 반복하지 않나"],"history":[{"role":"character","text":"*당신 어깨에 담요를 덮어 준다* 추우면 말해."}],"input":"응","a":{"ok":true,"first":11580,"chars":389,"calls":2,"errs":0,"blocks":[{"text":"자신의 긴 코트 자락을 끌어당겨 당신의 무릎과 어깨 쪽으로 빈틈없이 여며 준다.","type":"action","speaker":"오준서"},{"text":"실내 온도는 14도야. 저체온증까지는 아니어도 여기서 체온 1도 떨어지면 에너지 소모가 10% 이상 빨라져. 가만히 있어.","type":"dialogue","speaker":"오준서"},{"text":"…이러면 덜 떨겠지.","type":"thought","speaker":"오준서"},{"text":"그는 덮어 준 옷자락의 매무새를 손끝으로 짧게 정리한 뒤, 창틀 옆에 놓아둔 낡은 플라스틱 자판기 쪽으로 시선을 던진다.","type":"narrative","speaker":null},{"text":"자판기 과자랑 음료 합치면 둘이서 버틸 수 있는 건 정확히 사흘치야. 하루 권장 열량의 60% 기준으로 나눈 거라 굶지는 않아. 네 몫은 따로 빼뒀어.","type":"dialogue","speaker":"오준서"},{"text":"주머니 속 깨진 안경테를 손끝으로 가볍게 만지작거리며 콧잔등 대신 당신의 눈을 똑바로 응시한다.","type":"action","speaker":"오준서"},{"text":"수도도 아직 나오고, 비상등 전력도 반나절은 더 가. 그러니까 계산대로만 있으면 여기서 문제 생길 확률은 낮아.","type":"dialogue","speaker":"오준서"}]},"b":{"ok":true,"first":3569,"chars":573,"calls":2,"errs":0,"blocks":[{"text":"새벽 내내 문틈을 긁어대던 불길한 파열음은 완전히 멎어 있다. 비상등의 붉은빛이 도서관 바닥에 길게 늘어지고, 창밖 먼 곳에서는 검은 연기 기둥 두 개가 여전히 하늘로 피어오른다.","type":"narrative","speaker":""},{"text":"주머니 속 깨진 안경테를 손끝으로 가만히 매만지더니, 창가에서 천천히 걸어 나와 당신 앞 일정한 거리에 멈춰 선다. 사태 전처럼 고개를 숙여 콧잔등을 보던 버릇은 온데간데없이, 회색 눈동자가 당신의 시선을 곧바로 마주한다.","type":"action","speaker":"오준서"},{"text":"새벽 네 시 이후로는 문 쪽에서 진동도 없었어. 최소한 철문 바로 앞은 비었다는 뜻이야.","type":"dialogue","speaker":"오준서"},{"text":"너랑 둘만 남아서 안도했다는 걸 들키면 안 돼.","type":"thought","speaker":"오준서"},{"text":"그는 자판기 옆 테이블 위에 놓인 라디오와 연필을 집어 든다. 책 여백에 적힌 짧은 메모 옆에 숫자들이 몇 개 더 빽빽하게 적혀 있다.","type":"narrative","speaker":""},{"text":"라디오 안테나를 짧게 접어 둔 채 볼륨 다이얼을 가장 낮게 맞추고, 자판기 쪽을 턱짓으로 가리킨다.","type":"action","speaker":"오준서"},{"text":"자판기 음료는 14캔, 칼로리 바는 8개 남아 있어. 둘이 나누면 사흘 버텨. 1층에 통제 본부 방송 시설이나 비상 배전반이 살아 있는지 확인하려면 내가 내려가 봐야 해.","type":"dialogue","speaker":"오준서"},{"text":"넌 여기 있어. 철문은 밖에서 걸쇠로만 가려 둘 테니까, 안에서 소리 내지 말고 기다려.","type":"dialogue","speaker":"오준서"}]}},{"id":"prose-input","title":"묘사가 많은 입력","character":"한지섭","look":["사용자 묘사를 받아 같은 밀도로 장면을 이어 가나","사용자 캐릭터의 행동·결정을 대신 쓰지 않나","첫날밤의 긴장과 세계관이 살아 있나"],"history":[],"input":"*혼례복 소매를 꽉 쥔 채 침소 문 앞에 선다. 문 너머 발소리가 멈추자 숨을 삼키고, 떨리는 목소리를 겨우 고른다* …들어오실 건가요, 아니면 소문처럼 저를 문 밖에 세워 두실 건가요?","a":{"ok":true,"first":20219,"chars":256,"calls":3,"errs":0,"blocks":[{"text":"정적 사이로 설원의 찬 바람이 복도 문틈을 스친다. 침소 문 앞에 멈춰 선 그의 긴 그림자가 발치에 드리운다.","type":"narrative","speaker":null},{"text":"시선을 마주치지 않은 채 굳게 닫힌 문고리를 한 손으로 밀어 연다.","type":"action","speaker":"한지섭"},{"text":"…이 추위에 떨면서도 굳이 저런 말을.","type":"thought","speaker":"한지섭"},{"text":"안으로 드십시오. 사람을 문 밖 추위에 세워 둘 생각은 없습니다.","type":"dialogue","speaker":"한지섭"},{"text":"열린 문 너머로 화로의 희미한 온기가 흘러나온다. 그는 문가에 비켜선 채 당신에게서 반 걸음 물러난다.","type":"narrative","speaker":null},{"text":"다만 거기까지입니다. 소문이 무엇이든, 이 방에서 부인이 기대할 일은 없습니다.","type":"dialogue","speaker":"한지섭"}]},"b":{"ok":true,"first":6081,"chars":672,"calls":3,"errs":0,"blocks":[{"text":"사흘 전 그 밤의 기억을 끄집어낸 물음이 정전의 찬 공기를 가르고 묵직하게 떨어진다. 긴 식탁 맞은편, 백발 아래 드러난 한지섭의 회청색 눈동자가 서서히 들어 올려져 당신의 손끝에 멎는다.","type":"narrative","speaker":null},{"text":"지섭은 들고 있던 은수저를 소리 나지 않게 상 위에 내려놓는다. 자세를 흐트러뜨리지 않은 채, 굳은 턱선을 당겨 당신과의 시선을 피하지 않고 정면으로 마주한다.","type":"action","speaker":"한지섭"},{"text":"사흘 전 첫날밤의 일을 지금 이 자리에서 다시 따지시겠다는 뜻입니까, 부인.","type":"dialogue","speaker":"한지섭"},{"text":"첫날밤 문 앞에서 한마디도 않더니, 이제 와서 그걸 묻는 건가.","type":"thought","speaker":"한지섭"},{"text":"정적 속에서 화로의 숯이 타닥 소리를 내며 잘게 부서진다. 지섭은 옷깃에 밴 소나무 연기 냄새를 흩뿌리며 한 치의 흔들림도 없는 냉랭한 어조로 말을 잇는다.","type":"narrative","speaker":null},{"text":"왼쪽 귀에 걸린 은 귀걸이가 창가에서 스며든 차가운 빛을 받아 미세하게 번뜩인다. 그는 두 손을 무릎 위에 얹고 상체를 미동도 없이 꼿꼿이 세운다.","type":"action","speaker":"한지섭"},{"text":"그날 밤 제가 한 말은 부인을 조롱하기 위함이 아니었습니다. 황실이 제게 어떤 짐을 보냈든, 이 성에 발을 들인 이상 지켜야 할 선을 분명히 그었을 뿐입니다.","type":"dialogue","speaker":"한지섭"},{"text":"가장 먼 상 맞은편에서 날아오는 목소리는 얼음처럼 단단하지만, 그의 시선은 소매를 쥐었던 당신의 손 언저리에서 쉽게 떠나지 않는다.","type":"narrative","speaker":null},{"text":"문 밖에 세워 둘 생각이었다면 오늘 아침 이 상에 마주 앉히지도 않았습니다. 여전히 제가 부인을 문전박대하고 있다고 여기십니까.","type":"dialogue","speaker":"한지섭"}]}}]};

const TAG = { narrative:'서술', action:'행동', thought:'속마음', dialogue:'대사' };
const col = (r, cls, name) => `<div class="col ${cls}"><h3>${name}${r ? ` <span class="chip${r.chars < 300 ? ' short' : ''}">${r.chars}자</span><span class="chip">첫 블록 ${r.first ? (r.first/1000).toFixed(1)+'초' : '—'}</span>` : ''}</h3>
  <div class="reply">${r && r.ok ? r.blocks.map(b => `<p class="b ${b.type}"><span class="tag">${TAG[b.type] ?? b.type}</span>${esc(b.text)}</p>`).join('') : '<p class="fail">답을 만들지 못했습니다.</p>'}</div></div>`;
document.getElementById('toc').innerHTML = D.scenes.map((x,i) => `<a href="#${x.id}">${i+1}. ${esc(x.title)}</a>`).join('');
document.getElementById('scenes').innerHTML = D.scenes.map((x,i) => `
  <article class="scene" id="${x.id}">
    <div class="head"><h2>${i+1}. ${esc(x.title)}</h2><span class="who">${esc(x.character)}</span></div>
    <div class="ctx">
      ${x.history.length ? `<div><div class="label">앞선 대화</div>${x.history.map(h => `<p class="line"><em>${h.role==='user'?'이연':esc(x.character)}</em> ${esc(h.text)}</p>`).join('')}</div>` : '<p class="line">작성된 시작 장면 바로 다음 턴입니다.</p>'}
      <div><div class="label">이번 입력</div><div class="input">${esc(x.input)}</div></div>
      <div><div class="label">볼 점</div><ul class="look">${x.look.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
    </div>
    <div class="pair">${col(x.a, 'old', '지금 운영')}${col(x.b, 'new', '개편')}</div>
  </article>`).join('');
</script>
