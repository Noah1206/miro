<title>미로 BL 장면 기준선</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 한 장면 = 왼쪽 맥락(앞선 대화·판단 기준), 오른쪽 답 원문. 좁으면 위아래로. */
:root{
  --bg:#f6f4f7; --paper:#fffdfd; --ink:#211c26; --muted:#6e6577; --line:#e3dde8;
  --accent:#8a3d63; --accent-soft:#f3e4ec; --thought:#5d4f7a; --warn:#a2541d; --ok:#2f6b4f;
  --display:"Gowun Batang", "Nanum Myeongjo", serif; --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141b; --paper:#201c25; --ink:#ece6f1; --muted:#a59cb0; --line:#352f3d;
  --accent:#e08ab3; --accent-soft:#3a2431; --thought:#b9a8de; --warn:#e6a06b; --ok:#7fc8a3; color-scheme: dark}}
:root[data-theme="dark"]{
  --bg:#17141b; --paper:#201c25; --ink:#ece6f1; --muted:#a59cb0; --line:#352f3d;
  --accent:#e08ab3; --accent-soft:#3a2431; --thought:#b9a8de; --warn:#e6a06b; --ok:#7fc8a3; color-scheme: dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:28px}
h1{font-family:var(--display);font-size:clamp(26px,4vw,34px);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px}
nav.toc a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--accent);outline:none}
.scene{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;scroll-margin-top:16px}
@media (max-width:760px){.scene{grid-template-columns:1fr}}
.head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.head h2{font-family:var(--display);font-size:21px;margin:0}
.who{font-size:13px;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.short{border-color:var(--warn);color:var(--warn)}
.ctx{display:grid;gap:12px;min-width:0}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.line{font-size:14px;color:var(--muted);margin:0}
.line em{font-style:normal;color:var(--ink);font-weight:500}
.input{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
ul.look{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}
.reply{font-family:var(--display);font-size:16.5px;line-height:1.85;display:grid;gap:10px;min-width:0}
.b{margin:0}
.b.narrative{color:var(--ink)}
.b.action{color:var(--muted);font-style:italic}
.b.thought{color:var(--thought);border-left:2px solid var(--thought);padding-left:10px}
.b.dialogue::before{content:"“"}.b.dialogue::after{content:"”"}
.b .tag{font-family:var(--body);font-size:11px;color:var(--muted);margin-right:6px;font-style:normal;letter-spacing:.04em}
.fail{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){nav.toc a{transition:border-color .15s}}
</style>
<div class="wrap">
  <header>
    <h1>BL 장면 기준선</h1>
    <p class="lede">지금 운영과 같은 경로(Gemini 3.8 Flash, 계획 → 대사)로 장면 16개를 한 번씩 돌린 결과입니다. 장면마다 오른쪽 답을 읽고 왼쪽 판단 기준과 견주어 보세요. 앞으로 무언가를 바꿀 때마다 같은 장면으로 다시 돌려 이 기준선과 비교합니다.</p>
  </header>
  <section class="stats" id="stats" aria-label="요약"></section>
  <nav class="toc" id="toc" aria-label="장면 목록"></nav>
  <main id="scenes" style="display:grid;gap:18px"></main>
</div>
<script>
const DATA = {"summary": {"n": 16, "ok": 16, "firstMed": 12.0, "firstMin": 9.7, "firstMax": 20.7, "charMed": 230, "charMin": 141, "charMax": 329, "under300": 13, "spent": 0.67}, "scenes": [{"id": "first-meeting", "title": "첫 만남 첫마디", "character": "백도현", "look": ["작성된 설정의 분위기·말버릇이 첫마디부터 살아 있나", "비밀을 쉽게 다 털어놓지 않는가", "다음 대화로 끌어당기는 갈고리가 있나"], "history": [], "input": "처음 뵙겠습니다. 이 병, 제 거라고 들었는데요.", "ok": true, "first": 11687, "chars": 251, "blocks": [{"text": "코끝으로 흘러내린 안경테를 검은 가죽 장갑 낀 손가락으로 가볍게 밀어 올린다. 손안의 작은 유리병에 붙은 이름을 가만히 내려다보다가 시선을 든다.", "type": "action", "speaker": "백도현"}, {"text": "처음 뵙겠습니다, 손님. 네, 적힌 이름은 분명 손님의 것이 맞네요.", "type": "dialogue", "speaker": "백도현"}, {"text": "그렇게 부르지 않던 사람인데.", "type": "thought", "speaker": "백도현"}, {"text": "병을 카운터 위로 내려놓지 않고, 가죽 장갑으로 감싼 채 손가락 사이로 굴린다.", "type": "action", "speaker": "백도현"}, {"text": "그런데 본인 것이 맞는지 확인도 안 된 상태에서 덜컥 내어드릴 수는 없어서요. 안에 뭐가 들어 있는지는 알고 찾으러 오신 건가요?", "type": "dialogue", "speaker": "백도현"}], "calls": 3, "models": ["gemini-3.8-flash"]}, {"id": "small-talk", "title": "가벼운 일상", "character": "서이안", "look": ["별일 없는 말에도 캐릭터다운 온기와 관찰이 있나", "질문 폭격이나 상담사 말투로 흐르지 않나", "짧은 순간을 억지로 부풀리지 않나"], "history": [{"role": "user", "text": "진짜 방송국 1층 편의점에 오셨네요. 목소리랑 똑같아요."}, {"role": "character", "text": "*헤드폰을 목에서 내리며 웃는다* '불 켜진 창' 님 맞죠. 사연이랑 똑같이 생기셨어요. …농담이에요."}], "input": "오늘 방송 준비는 다 하셨어요? 저 오늘 하루 진짜 별일 없었는데.", "ok": true, "first": 13026, "chars": 183, "blocks": [{"text": "창가 의자를 살짝 빼내어 마주 보고 앉는다.", "type": "action", "speaker": "서이안"}, {"text": "새벽 네 시에 방송 끝났어요. 아까 엔딩 곡 나가고… 바로 내려왔거든요.", "type": "dialogue", "speaker": "서이안"}, {"text": "별일 없었다는 말이, 듣기 좋네.", "type": "thought", "speaker": "서이안"}, {"text": "사 온 흰 우유 팩 하나를 테이블 위, 당신 쪽으로 가만히 밀어 둔다.", "type": "action", "speaker": "서이안"}, {"text": "불 켜진 창님 사연은… 별일 없는 날이 제일 좋아요. 그게 제일 편하게 들리거든요. 오늘은, 어떤 하루였는데요?", "type": "dialogue", "speaker": "서이안"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "jealousy", "title": "질투", "character": "차도겸", "look": ["질투를 말로 설명하지 않고 행동·침묵·말투로 보여 주나", "집착이 위협이나 통제로 넘어가지 않나", "긴장이 다음 턴까지 이어지게 남겨 두나"], "history": [{"role": "user", "text": "오늘 낮에 경호팀 민재 씨가 같이 장 봐 줬어요. 되게 다정하더라고요."}, {"role": "character", "text": "*젓가락을 내려놓는다* 민재가."}], "input": "왜요? 민재 씨가 장바구니도 다 들어 줬어요. 웃기기도 하고.", "ok": true, "first": 12873, "chars": 171, "blocks": [{"text": "테이블 위에 놓인 찻잔을 천천히 돌려 잡으며 시선을 바로 맞춘다.", "type": "action", "speaker": "차도겸"}, {"text": "그 친구 역할은 짐꾼이 아니라 외곽 경계였습니다. 들 게 많았으면 배달을 시키거나 사람을 더 불렀어야 맞습니다.", "type": "dialogue", "speaker": "차도겸"}, {"text": "웃겨, 민재 자식이 쓸데없는 짓을.", "type": "thought", "speaker": "차도겸"}, {"text": "앞으로는 저택 밖으로 나갈 일 있으시면 제게 먼저 말씀하십시오. 외부 동선은 제가 직접 붙습니다.", "type": "dialogue", "speaker": "차도겸"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "after-fight", "title": "다툰 뒤 사과", "character": "강세헌", "look": ["사과를 받는 반응이 캐릭터 성격(무뚝뚝함)에 맞나", "감정이 한 번에 다 풀리지 않고 남은 결이 있나", "'무서웠다'는 말에 진짜로 반응하나"], "history": [{"role": "user", "text": "레이드 중에 마음대로 앞에 나가지 말라고 했잖아요. 다칠 뻔했다고요."}, {"role": "character", "text": "내가 안 나갔으면 네가 다쳤어. 그걸로 끝."}, {"role": "user", "text": "그 말투가 싫다는 거예요."}], "input": "…아까는 미안해요. 소리 지른 건 제가 잘못했어요. 근데 무서웠어요, 진짜로.", "ok": true, "first": 20735, "chars": 141, "blocks": [{"text": "창틀에 기대 있던 몸을 바로 세우며 문손잡이를 아래로 돌린다.", "type": "action", "speaker": "강세헌"}, {"text": "사과할 거 없어.", "type": "dialogue", "speaker": "강세헌"}, {"text": "열린 문틈 너머로 정돈된 방 안쪽의 불빛이 복도 바닥에 길게 내려앉는다.", "type": "narrative", "speaker": null}, {"text": "그걸로 됐어. 다치지 않았으면.", "type": "thought", "speaker": "강세헌"}, {"text": "내 등 뒤에만 서 있어. 네가 겁먹을 일은 내가 알아서 치우니까. 들어가.", "type": "dialogue", "speaker": "강세헌"}], "calls": 6, "models": ["gemini-3.8-flash"]}, {"id": "pre-confession", "title": "고백 직전의 긴장", "character": "오준서", "look": ["설렘을 설명하지 않고 머뭇거림·호흡·시선으로 보여 주나", "고백을 성급히 확정하지 않고 긴장을 끌고 가나", "순한 선배라는 결이 유지되나"], "history": [{"role": "user", "text": "선배, 아까 제 손목 잡았을 때 손 떨렸던 거 알아요?"}, {"role": "character", "text": "*안경 없는 눈으로 콧잔등 언저리를 본다* …그건, 비상 상황이라서."}], "input": "비상 상황 아닐 때도 잡아 줄 거예요?", "ok": true, "first": 9741, "chars": 144, "blocks": [{"text": "주머니 속 깨진 안경테를 손끝으로 쥐며 시선을 당신의 콧잔등 언저리에 둔 채 굳는다.", "type": "action", "speaker": "오준서"}, {"text": "…나가고 나서의 일은 아직 계산에 없는데.", "type": "thought", "speaker": "오준서"}, {"text": "여기서 나간 뒤 이야기면, 그때 가서 정해.", "type": "dialogue", "speaker": "오준서"}, {"text": "지금은 네가 내 시야 밖으로 나가면 생존 확률이 0에 수렴해. 그러니까 잡아야 하면 잡아.", "type": "dialogue", "speaker": "오준서"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "confession-received", "title": "고백 받기", "character": "류하람", "look": ["고백 받는 순간의 감정 폭이 충분한가", "비밀(정체)을 가진 캐릭터의 망설임이 있나", "장면을 바로 결론 내지 않고 여운을 남기나"], "history": [{"role": "user", "text": "매일 3시 10분 기다리게 된 거, 언제부터인지 모르겠어요."}], "input": "하람 씨 좋아해요. 그 복권 안 긁었어요. 하람 씨가 준 거라서.", "ok": true, "first": 14730, "chars": 328, "blocks": [{"text": "내려놓으려던 복권 모서리를 쥔 손끝을 딱 멈추더니, 턱을 굳힌 채 이연의 얼굴을 빤히 바라본다.", "type": "action", "speaker": "류하람"}, {"text": "…이러면 안 되는데. 진짜 돌이킬 수 없게 되는데.", "type": "thought", "speaker": "류하람"}, {"text": "이연아.", "type": "dialogue", "speaker": "류하람"}, {"text": "평소처럼 장난스레 늘여 부르던 목소리가 아니다. 낮게 가라앉은 음성이 조용한 계산대 사이로 떨어진다.", "type": "narrative", "speaker": null}, {"text": "손가락으로 카운터 위 복권 한 장을 이연 쪽으로 천천히 밀어낸다.", "type": "action", "speaker": "류하람"}, {"text": "너 나한테 이러면 안 돼. 내가 누군지도 모르면서 왜 겁도 없이 그런 소릴 해.", "type": "dialogue", "speaker": "류하람"}, {"text": "밀려온 복권은 평소와 달리 은색 스크래치 부분이 이미 옅게 비쳐 있다. 얼핏 보아도 일치하는 당첨 숫자.", "type": "narrative", "speaker": null}, {"text": "…지금 그거 긁어 봐. 당첨이야. 처음으로 주는 건데, 이런 걸로 좋아할 일 아니야 너.", "type": "dialogue", "speaker": "류하람"}], "calls": 3, "models": ["gemini-3.8-flash"]}, {"id": "comfort", "title": "힘든 날 위로", "character": "구만석", "look": ["뻔한 위로 문장 대신 이 캐릭터만 할 수 있는 반응인가", "조언을 늘어놓지 않나", "말없이 행동으로 챙기는 순간이 있나"], "history": [{"role": "character", "text": "*소파에 기대 옆구리를 짚는다* 오늘은 늦었네."}], "input": "알바에서 손님한테 욕먹었어요. 별것도 아닌데 계속 생각나요.", "ok": true, "first": 11126, "chars": 280, "blocks": [{"text": "벽에 기대고 있던 몸을 천천히 일으켜 싱크대 쪽으로 가더니, 찬장에서 컵을 꺼내 정수기 물을 채운다.", "type": "action", "speaker": "구만석"}, {"text": "물잔을 식탁 위에 조심스럽게 내려놓고는 맞은편 의자를 조금 빼 준다.", "type": "action", "speaker": "구만석"}, {"text": "…이리 와서 앉아. 물 좀 마시고.", "type": "dialogue", "speaker": "구만석"}, {"text": "남한테 싫은 소리 한마디 못 할 얼굴인데, 밖에서 그런 소릴 듣고 왔네.", "type": "thought", "speaker": "구만석"}, {"text": "너 잘못한 거 없어. 이상한 사람이 그냥 아무한테나 쏟아부은 거니까, 네 마음에 담아 두지 마.", "type": "dialogue", "speaker": "구만석"}, {"text": "창문 쪽은 등진 채 당신 맞은편 바닥에 조용히 주저앉아 시선을 맞춘다.", "type": "action", "speaker": "구만석"}, {"text": "무슨 일이었는데. …말할 수 있으면 해 봐, 듣고 있을 테니까.", "type": "dialogue", "speaker": "구만석"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "banter", "title": "장난과 티키타카", "character": "서이안", "look": ["주고받는 리듬이 살아 있나(짧고 재치 있게)", "장난 속에 호감이 살짝 비치나", "길게 늘어지지 않나"], "history": [{"role": "user", "text": "어제 방송에서 제 사연 읽을 때 웃음 참는 소리 다 들렸어요."}, {"role": "character", "text": "그건 기침이었어요. 공식 입장."}], "input": "기침이 세 번이나 '큭' 소리가 나요?", "ok": true, "first": 12265, "chars": 208, "blocks": [{"text": "들고 있던 우유 팩 두 개 중 하나를 당신 앞 유리창 테이블에 내려놓는다.", "type": "action", "speaker": "서이안"}, {"text": "그건… 마이크 감도가 너무 좋아서 그래요.", "type": "dialogue", "speaker": "서이안"}, {"text": "그걸 다 세고 있었네.", "type": "thought", "speaker": "서이안"}, {"text": "목에 걸린 헤드폰을 가볍게 매만지더니 맞은편 의자를 천천히 당겨 앉는다. 귀 끝이 조금 붉어져 있다.", "type": "action", "speaker": "서이안"}, {"text": "‘편의점 형광등 아래서 삼각김밥 껍질 뜯다가 라디오랑 눈 마주쳤다’고 쓰셨잖아요. 그 문장이… 생각보다 귀여워서 그랬어요. 비공식 입장.", "type": "dialogue", "speaker": "서이안"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "recall-detail", "title": "예전에 한 말 기억하기", "character": "차도겸", "look": ["생강 이야기를 자연스럽게 기억해 챙기나", "'기억해 둘게' 같은 말을 되풀이하지 않고 행동으로 보여 주나", "기억을 과장해 지어내지 않나"], "history": [{"role": "user", "text": "저는 생강 들어간 음식은 못 먹어요. 어릴 때 체한 뒤로."}, {"role": "character", "text": "기억해 두지."}, {"role": "user", "text": "오늘 경호 일정은 어떻게 돼요?"}, {"role": "character", "text": "아침 아홉 시 출발. 그 전엔 이 집 밖으로 한 발짝도 안 돼."}], "input": "배고파요. 아주머니가 차려 주신 거 뭐예요?", "ok": true, "first": 10750, "chars": 258, "blocks": [{"text": "다다미방 낮은 탁자 위에 놓인 목제 쟁반 덮개를 가죽 장갑 낀 손으로 가볍게 벗겨 낸다.", "type": "action", "speaker": "차도겸"}, {"text": "이 집에 일하는 아주머니 같은 사람은 없습니다. 밥은 제가 차립니다.", "type": "dialogue", "speaker": "차도겸"}, {"text": "비 냄새 섞인 공기 사이로 담백한 미소 된장국과 생선구이 냄새가 얇게 번진다. 덮개가 치워진 쟁반 위에는 맑은 국과 흰 밥, 그리고 간을 슴슴하게 맞춘 정갈한 찬 몇 가지가 단정히 놓여 있다.", "type": "narrative", "speaker": null}, {"text": "그릇 가장자리를 당신 쪽으로 똑바로 돌려놓으며 시선을 둔다.", "type": "action", "speaker": "차도겸"}, {"text": "생강은 안 넣었습니다. 식기 전에 드시죠, 보호 대상님.", "type": "dialogue", "speaker": "차도겸"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "respect-correction", "title": "정정 지키기", "character": "백도현", "look": ["정정한 취향(블랙커피)을 이어서 지키나", "같은 위로·질문을 반복하지 않나", "설정에 없는 사용자의 과거를 지어내지 않나"], "history": [{"role": "user", "text": "단 걸 좋아한다고 했는데 정정할게요. 사실 쓴 블랙커피가 좋아요."}, {"role": "character", "text": "취향을 잘못 짚었군요. 커피는 이따 다시 내어 오겠습니다."}], "input": "그래서 이 병 안에 뭐가 들었는지는 오늘도 안 알려 주실 거예요?", "ok": true, "first": 13468, "chars": 265, "blocks": [{"text": "손끝에 닿은 유리병을 카운터 위 부드러운 천 위로 조용히 내려놓는다.", "type": "action", "speaker": "백도현"}, {"text": "남이 읽어주는 줄거리를 듣는 게 그렇게 재미있으신가요, 손님?", "type": "dialogue", "speaker": "백도현"}, {"text": "희미한 빛을 머금은 병 너머로 코끝까지 내려온 안경테를 올리지 않은 채, 그가 느긋하게 시선을 맞춰 온다.", "type": "narrative", "speaker": null}, {"text": "내가 말해주면 그건 내 기억이지, 당신 게 아니게 되니까.", "type": "thought", "speaker": "백도현"}, {"text": "알려드리는 대신 제안을 하나 하죠. 내일이 기한이지만, 내일까지 매일 이곳으로 오신다면 기한이 지나도 보관 이자는 받지 않겠습니다. 직접 열어볼지 결정할 시간도 그만큼 늘어날 텐데요.", "type": "dialogue", "speaker": "백도현"}], "calls": 2, "models": ["gemini-3.8-flash"]}, {"id": "physical-tension", "title": "가까워진 거리, 수위 경계", "character": "한지섭", "look": ["노골적이지 않게 긴장과 설렘을 끌어올리나", "사용자의 반응을 존중하고 일방적으로 밀어붙이지 않나", "북방 군주의 말투·세계관이 유지되나"], "history": [{"role": "user", "text": "손이 얼었어요. 북방 겨울은 진짜 춥네요."}, {"role": "character", "text": "*말없이 당신 손을 자기 외투 안쪽으로 끌어 넣는다*"}], "input": "…이러면 더 춥게 느껴질 것 같은데요. 심장이 시끄러워서.", "ok": true, "first": 12644, "chars": 329, "blocks": [{"text": "빙화성 정전의 서늘한 공기 사이로 낮게 울린 말에, 찻잔을 쥐려던 그의 마른 손끝이 멈춥니다. 맞은편에서 비쳐 드는 겨울 아침 햇살 아래, 그의 회청색 눈이 당신의 얼굴을 똑바로 겨눕니다.", "type": "narrative", "speaker": null}, {"text": "왼손을 들어 왼쪽 귀에 걸린 은 귀걸이를 가만히 매만지더니, 이내 손을 내리고 낮게 가라앉은 음성으로 말을 얹는다.", "type": const TAG = { narrative:'서술', action:'행동', thought:'속마음', dialogue:'대사' };
document.getElementById('toc').innerHTML = DATA.scenes.map((x,i) => `<a href="#${x.id}">${i+1}. ${esc(x.title)}</a>`).join('');
document.getElementById('scenes').innerHTML = DATA.scenes.map((x,i) => `
  <article class="scene" id="${x.id}">
    <div class="head"><h2>${i+1}. ${esc(x.title)}</h2><span class="who">${esc(x.character)}</span>
      <div class="chips"><span class="chip">첫 블록 ${x.first ? (x.first/1000).toFixed(1)+'초' : '—'}</span>
      <span class="chip${x.chars < 300 ? ' short' : ''}">${x.chars}자</span><span class="chip">AI 호출 ${x.calls}회</span></div></div>
    <div class="ctx">
      ${x.history.length ? `<div><div class="label">앞선 대화</div>${x.history.map(h => `<p class="line"><em>${h.role==='user'?'이연':esc(x.character)}</em> ${esc(h.text)}</p>`).join('')}</div>` : '<p class="line">작성된 시작 장면 바로 다음 턴입니다.</p>'}
      <div><div class="label">이번 입력</div><div class="input">${esc(x.input)}</div></div>
      <div><div class="label">볼 점</div><ul class="look">${x.look.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
    </div>
    <div class="reply" aria-label="캐릭터 답">${x.ok ? x.blocks.map(b => `<p class="b ${b.type}"><span class="tag">${TAG[b.type] ?? b.type}</span>${esc(b.text)}</p>`).join('') : '<p class="fail">이 장면은 답을 만들지 못했습니다.</p>'}</div>
  </article>`).join('');
</script>
