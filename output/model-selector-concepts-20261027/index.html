const providerIcons={"Anthropic": "<svg class=\"model-glyph\" aria-hidden=\"true\" fill=\"currentColor\" fill-rule=\"evenodd\" height=\"1em\" style=\"flex:none;line-height:1\" viewBox=\"0 0 24 24\" width=\"1em\" xmlns=\"http://www.w3.org/2000/svg\"><title>Claude</title><path d=\"M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z\"></path></svg>", "OpenAI": "<svg class=\"model-glyph\" aria-hidden=\"true\" fill=\"currentColor\" fill-rule=\"evenodd\" height=\"1em\" style=\"flex:none;line-height:1\" viewBox=\"0 0 24 24\" width=\"1em\" xmlns=\"http:/ function modelIcon(model){return providerIcons[model.provider];}
function brandTone(model){return model.provider==='Anthropic'?{ink:'#e6a089',logo:'#d97757'}:{ink:'#eeeef1',logo:'#ffffff'};}
function tone(model){const color=brandTone(model);return `--model-fill:transparent;--model-ink:${color.ink};--model-logo:${color.logo}`;}
function applyTone(element,model){const color=brandTone(model);element.style.setProperty('--model-fill','transparent');element.style.setProperty('--model-ink',color.ink);element.style.setProperty('--model-logo',color.logo);}
function options(selected){return '<div class="menu-head"><strong>AI 모델</strong><span class="sample-badge">차감량은 예시</span></div>'+providers.map(provider=>`<div role="group" aria-label="${provider}"><p class="provider" role="presentation">${provider}</p>${models.filter(m=>m.provider===provider).map(m=>`<button class="option" style="${tone(m)}" type="button" role="menuitemradio" aria-checked="${m.id===selected}" data-model="${m.id}"><span class="option-copy"><span class="option-title">${modelIcon(m)}<span>${m.name}</span></span><span class="option-desc">${m.desc}</span></span><span class="cost-col"><span class="cost"><small>예시</small>${m.tokens} 토큰<span class="per-turn">/턴</span></span>${check}</span></button>`).join('')}</div>`).join('')+'<p class="menu-foot">사용자 메시지 1개에 대한 AI 답변 1회를 1턴으로 계산해요.<br>표시된 토큰은 시안용 예시 요금이에요.</p>';}
document.getElementById('previews').innerHTML=designs.map(d=>`<a class="preview ${d.kind}" href="#concept-${d.id}" aria-label="${d.id}안 ${d.name} 자세히 보기"><span class="model" style="${tone(models.find(m=>m.id===d.initial))}">${modelIcon(models.find(m=>m.id===d.initial))}<span class="brand">${models.find(m=>m.id===d.initial).label}</span>${chevron}</span><small>${d.id} · ${d.name}</small></a>`).join('');
document.getElementById('concepts').innerHTML=designs.map(d=>`<section id="concept-${d.id}" class="concept ${d.kind}" aria-labelledby="title-${d.id}"><div class="caption"><span class="letter">${d.id}</span><h2 id="title-${d.id}">${d.name}</h2>${d.recommended?'<span class="recommend">추천</span>':''}</div><div class="phone"><div class="status"><span>9:41</span><div class="signals"><svg aria-hidden="true" width="12" height="9" viewBox="0 0 12 9" fill="currentColor"><path d="M0 6h2v3H0zM3 4h2v5H3zM6 2h2v7H6zM9 0h2v9H9z"/></svg><span class="battery"></span></div></div><header class="header"><span class="back" aria-hidden="true"><svg width="18" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></span><span class="name">토마스</span><span class="hamburger" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span></header><div class="chat"><p class="scene">창밖의 빗소리가 잠깐의 침묵을 채웠다.<br>그가 내려놓은 찻잔에서 김이 피어올랐다.</p><p class="speaker">토마스</p><p class="line">비가 그칠 때까지만 있어요.<br>…차는 더 줄 수 있으니까.</p><p class="subline">그는 시선을 피한 채, 당신 쪽으로<br>따뜻한 찻잔을 조금 더 밀어주었다.</p></div><div class="focus-label">선택한 모델은 입력란 아래에 표시</div><div class="composer"><div class="placeholder">대사, 행동, 묘사를 자유롭게…</div><div class="composer-controls"><div class="picker"><button class="model" style="${tone(models.find(m=>m.id===d.initial))}" type="button" aria-label="${d.id}안 AI 모델 선택" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-${d.id}" title="${models.find(m=>m.id===d.initial).name}">${modelIcon(models.find(m=>m.id===d.initial))}<span class="brand">${models.find(m=>m.id===d.initial).label}</span>${chevron}</button><div id="menu-${d.id}" class="dropdown" role="menu" aria-label="AI 모델 선택" hidden>${options(d.initial)}</div></div><div class="tools"><span class="tool" aria-hidden="true">＊</span><span class="tool" aria-hidden="true">/</span><span class="send" aria-hidden="true">↑</span></div></div></div><div class="home"></div></div><div class="detail"><p>${d.desc}</p><div class="spec">${d.spec.map(x=>`<span>${x}</span>`).join('')}</div></div></section>`).join('');
function closeAll(except){document.querySelectorAll('.picker').forEach(p=>{if(p!==except){p.querySelector('.model').setAttribute('aria-expanded','false');p.querySelector('.dropdown').hidden=true;}})}
document.querySelectorAll('.picker').forEach(p=>{
 const trigger=p.querySelector('.model'),menu=p.querySelector('.dropdown');
 trigger.addEventListener('click',()=>{const open=trigger.getAttribute('aria-expanded')!=='true';closeAll(p);trigger.setAttribute('aria-expanded',String(open));menu.hidden=!open;if(open){const current=menu.querySelector('[aria-checked=true]');menu.scrollTop=Math.max(0,current.offsetTop-menu.clientHeight/2+current.offsetHeight/2);}});
 trigger.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();closeAll(p);trigger.setAttribute('aria-expanded','true');menu.hidden=false;menu.querySelector('[aria-checked=true]').focus();}});
 menu.querySelectorAll('.option').forEach(option=>option.addEventListener('click',()=>{const selected=models.find(m=>m.id===option.dataset.model);trigger.querySelector('.brand').textContent=selected.label;trigger.querySelector('.model-glyph').outerHTML=modelIcon(selected);trigger.title=selected.name;applyTone(trigger,selected);menu.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-checked',String(x===option)));const preview=p.closest('.concept').id;const summary=document.querySelector(`.preview[href="#${preview}"] .model`);summary.querySelector(".brand").textContent=selected.label;summary.querySelector(".model-glyph").outerHTML=modelIcon(selected);applyTone(summary,selected);closeAll();trigger.focus();}));
 menu.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=[...menu.querySelectorAll('.option')],i=items.indexOf(document.activeElement);items[e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}});
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.picker'))closeAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const active=document.querySelector('.model[aria-expanded=true]');closeAll();active?.focus();}});
</script>
