<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3차 캐릭터 시안</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #111; color: #eee; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #1c1c1c; border-radius: 12px; overflow: hidden; }
  img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
  figcaption { padding: 12px 14px; }
  .name { font-size: 18px; font-weight: 700; }
  .desc { font-size: 13px; color: #aaa; margin-top: 4px; }
</style>
</head>
<body>
<h1>3차 캐릭터 시안 · Seedream v5 Pro</h1>
<div class="grid">
  <figure><img src="tak-muwon-v1.png" alt="탁무원"><figcaption><div class="name">탁무원</div><div class="desc">29세 · 흑호 가문 가주 · 흑발에 흰 줄, 금안, 범 귀, 빨간 방울</div></figcaption></figure>
  <figure><img src="jin-taegyeong-v1.png" alt="진태경"><figcaption><div class="name">진태경</div><div class="desc">32세 · 오메가버스 후견인 약혼 · 쓰리피스 정장, 낡은 시계</div></figcaption></figure>
  <figure><img src="yoon-sion-v1.png" alt="윤시온"><figcaption><div class="name">윤시온</div><div class="desc">30세 · 국민 남친 · 갈색 머리, 모자, 회색 후드</div></figcaption></figure>
  <figure><img src="hyeokryeon-mu-v1.png" alt="혁련무"><figcaption><div class="name">혁련무</div><div class="desc">32세 · 무협 · 긴 흑발에 붉은 끈, 목의 마기 문양, 검은 장포</div></figcaption></figure>
  <figure><img src="ju-hangyeol-v1.png" alt="주한결"><figcaption><div class="name">주한결</div><div class="desc">34세 · 은테 안경, 남색 정장, 만년필</div></figcaption></figure>
  <figure><img src="yeon-ido-v1.png" alt="연이도"><figcaption><div class="name">연이도</div><div class="desc">26세 · 백금발, 남색 눈, 이어피스, 검은 집업</div></figcaption></figure>
</div>
</body>
</html>
