name: cron

# Vercel Hobby 플랜은 cron 을 하루 1회만 허용한다. 이 스케줄러는 계좌이체 승인 건 지급,
# 이용권 만료와 만료 안내, 선연락 판단까지 맡으므로 하루 1회로는 입금 후 지급이 최대
# 하루 늦어진다. 그래서 호출만 여기서 대신한다 — 앱 코드는 그대로다.
#
# Pro 플랜으로 올리면 vercel.json 에 crons 를 되돌리고 이 워크플로를 지운다.
on:
  schedule:
    # GitHub 의 스케줄은 혼잡하면 수 분 밀린다. 스케줄러가 idempotent 해서 문제되지 않는다.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 앞선 실행이 남아 있으면 겹쳐 돌리지 않는다.
concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  reality:
    runs-on: ubuntu-latest
    steps:
      - name: Run the scheduler
        env:
          BASE: ${{ secrets.PRODUCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "PRODUCTION_BASE_URL / CRON_SECRET 시크릿이 필요하다"; exit 1
          fi
          # 본문을 남겨 둔다 — 지급·만료 건수가 여기 찍힌다.
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}/api/cron/reality")
          cat /tmp/out.json; echo
          [ "$code" = "200" ] || { echo "스케줄러 실패: HTTP $code"; exit 1; }
